<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Telegram Drive - فضای ابری شخصی روی تلگرام" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telegram Drive" />
    <title>Telegram Drive</title>
    <style>
      #boot-error{display:none;position:fixed;top:0;left:0;right:0;max-height:60vh;overflow:auto;background:#7f1d1d;color:#fff;padding:10px 14px;font-family:monospace;font-size:12px;z-index:9999;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all}
      #boot-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:Tahoma,sans-serif;color:#64748b}
    </style>
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__deferredPrompt = e; });
      window.__BOOT_LOG = [];
      function blog(m) { window.__BOOT_LOG.push(m); }
      function showLog() { var el = document.getElementById('boot-error'); if (el) { el.style.display = 'block'; el.textContent = window.__BOOT_LOG.join('\n'); } }
      window.addEventListener('error', function (e) { blog('ERROR: ' + (e.message || '?') + ' @' + (e.filename || '') + ':' + (e.lineno || '')); showLog(); }, true);
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; blog('REJECTION: ' + (r && r.message ? r.message : String(r))); showLog(); });
    </script>
  </head>
  <body>
    <div id="boot-loading">در حال بارگذاری Telegram Drive...</div>
    <div id="boot-error"></div>
    <div id="root"></div>
    <script>blog('stage 1: html parsed');</script>
    <script type="module">blog('stage 2: inline module ok');</script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () { setTimeout(function () { if (!window.__APP_OK__) { blog('stage 3: APP DID NOT BOOT'); try { performance.getEntriesByType('resource').forEach(function (r) { blog('  [' + (r.responseStatus || 'x') + '] ' + r.name); }); } catch (e) {} showLog(); } }, 5000); });
    </script>
  </body>
</html>
